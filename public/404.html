<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Signal Lost | Pineforge Digital LLC</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(180deg, #fff 0%, #333 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navigation -->
        <header class="main-nav">
            <a href="home" class="logo">
                <img src="Brand_Logo_clear.png" alt="Pineforge Digital LLC">
            </a>
        </header>

        <main class="error-container schematic-bg">
            <h1 class="error-code">404</h1>
            <p class="error-message">Signal Lost. Module Not Found.</p>
            <a href="home" class="btn btn-primary">Return to Base</a>
        </main>
    </div>
</body>

</html>

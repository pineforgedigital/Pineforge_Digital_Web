<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            background-color: #0B1120;
            background-image:
                radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.3) 0%, rgba(129, 140, 248, 0.1) 40%, transparent 80%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Tech Grid Background (Subtle) */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
            z-index: 0;
        }

        .content {
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.4));
        }

        h1 {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        p {
            font-size: 2rem;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        .badge {
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 50px;
            color: #38bdf8;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="content">
        <!-- Using the verified logo path -->
        <img src="images/Brand_Logo_clear.png" alt="Logo" class="logo">
        <h1>Pineforge Digital</h1>
        <p>Building Software Products & Custom Solutions</p>
        <div class="badge">Est. 2026 • Wisconsin, USA</div>
    </div>
</body>

</html>
